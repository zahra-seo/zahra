services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zahra
      POSTGRES_PASSWORD: zahra
      POSTGRES_DB: zahra
    ports:
      - "5433:5432"   # 5433 outside to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zahra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6380 outside to avoid clashing with a local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
